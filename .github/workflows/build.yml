name: KueTV 2

# Every push to this branch: test, build, and put the app on the "kuetv2" download.
on:
  push:
    branches: [ kuetv2 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuetv2-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
      KUETV_DRIVE_CLIENT_ID: ${{ secrets.KUETV_DRIVE_CLIENT_ID }}
      KUETV_DRIVE_CLIENT_SECRET: ${{ secrets.KUETV_DRIVE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/KueTV2.apk
          # The TV's Downloader code asks for the newest download by these two older names: give it KueTV 2.
          cp dist/KueTV2.apk dist/KueTV.apk
          cp dist/KueTV2.apk dist/OwnTV.apk
          printf 'KueTV 2, version %s\n' "$VERSION_NAME" > dist/NOTES.md
          echo "Torrent engine in this build:"; unzip -l dist/KueTV2.apk | grep '\.so$' || echo "MISSING"
          if [ -n "$KUETV_DRIVE_CLIENT_ID" ] && [ -n "$KUETV_DRIVE_CLIENT_SECRET" ]; then echo "Google Drive keys: in this build"; else echo "Google Drive keys: MISSING from this build"; fi

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kuetv2
          target_commitish: ${{ github.sha }}
          name: KueTV 2 (${{ env.VERSION_NAME }})
          files: |
            dist/KueTV2.apk
            dist/KueTV.apk
            dist/OwnTV.apk
          body_path: dist/NOTES.md
          prerelease: false
          make_latest: true
