name: KueSounds

# Every push to this branch: test, build, and put the app on the "kuesounds" download.
on:
  push:
    branches: [ kuesounds ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuesounds-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/KueSounds.apk
          printf 'KueSounds, version %s\n' "$VERSION_NAME" > dist/NOTES.md
          # What the app reads each time it opens, to know whether a newer version is waiting.
          printf 'code=%s\nname=%s\n' "$VERSION_CODE" "$VERSION_NAME" > dist/version.txt

      # make_latest stays false: the TV's Downloader code for KueTV fetches the project's "latest" download,
      # which must always be KueTV's.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kuesounds
          target_commitish: ${{ github.sha }}
          name: KueSounds (${{ env.VERSION_NAME }})
          files: |
            dist/KueSounds.apk
            dist/version.txt
          body_path: dist/NOTES.md
          prerelease: false
          make_latest: false
